<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111722"><title>Florida Run GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#111722;color:#fff;font:16px system-ui,sans-serif}#map{position:absolute;inset:0;filter:grayscale(1) brightness(.7) contrast(1.4)}.top{position:absolute;z-index:900;top:12px;left:12px;right:12px;background:#111722ed;border:2px solid #f735bc;border-radius:14px;padding:12px;box-shadow:0 5px 20px #0009}.top b{font-size:23px;letter-spacing:1px;text-shadow:2px 2px #000}.top small{display:block;color:#bbb}.panel{position:absolute;z-index:900;bottom:12px;left:12px;right:12px;background:#111722f2;border:2px solid #f735bc;border-radius:15px;padding:12px;box-shadow:0 5px 25px #000b}.panel h2{margin:4px 0 8px;font-size:19px}.panel p{margin:7px 0;color:#ccd3de;font-size:13px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,select{width:100%;padding:12px;border:0;border-radius:9px;background:#24374a;color:white;font-weight:750;font-size:14px}button.primary{background:#f735bc;color:#111}select{margin:7px 0 10px}.min{position:absolute;right:10px;top:10px;width:auto;padding:5px 10px}.panel.collapsed .inside{display:none}.leaflet-control-attribution{font-size:10px}.car{font-size:29px;filter:drop-shadow(0 2px 3px black)}.stop{background:#f735bc;border:2px solid white;border-radius:50%;color:#111;font-weight:900;text-align:center;line-height:27px;width:30px;height:30px;box-shadow:0 1px 8px #0009} .top{top:8px;left:8px;right:auto;width:auto;padding:7px 12px;border:1px solid #aaa;background:#17191edb;box-shadow:none}.top b{font-size:16px}.top small{display:none}.panel{bottom:0;left:0;right:0;border:0;border-top:2px solid #9c54ff;border-radius:18px 18px 0 0;padding:9px 13px 12px;background:#16181bea}.panel h2{font-size:16px;margin:3px 38px 4px 0}.panel p{font-size:12px;margin:4px 0}.panel select{padding:8px;margin:3px 0 6px}.buttons button{padding:9px}.panel.collapsed{bottom:8px;left:8px;right:8px;border:1px solid #9c54ff;border-radius:12px}.car{font-size:34px;color:white;text-shadow:0 2px 3px black}.stop{background:#9c54ff}.leaflet-control-zoom{margin-top:70px!important}.navhud{position:absolute;z-index:899;top:60px;left:10px;background:#17191eea;color:#fff;padding:10px 14px;border-radius:12px;font-weight:900;font-size:24px;border-left:5px solid #9c54ff;min-width:125px}.navhud small{display:block;font-size:11px;color:#ddd;font-weight:600}.panel.collapsed .min{position:static;float:right} </style></head><body><div id="map"></div><header class="top"><b>FLORIDA RUN ◈ GPS</b><small>VICE CITY–INSPIRED • LIVE ROAD TRIP</small></header><div class="navhud"><span id="distance">-- mi</span><small>TO NEXT MISSION</small></div><section class="panel" id="panel"><button class="min" onclick="document.getElementById('panel').classList.toggle('collapsed')">▾</button><h2 id="mission">NEXT MISSION</h2><div class="inside"><p id="status">Tap Start GPS to enable live location.</p><select id="dest"></select><div class="buttons"><button class="primary" id="start">◎ START GPS</button><button id="navigate">↗ GOOGLE MAPS</button><button id="complete">✓ COMPLETE STOP</button><button id="center">⌖ CENTER CAR</button></div><p>Live GPS needs HTTPS and location permission. Google Maps provides turn-by-turn directions. Tracking may pause in the background.</p></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const stops=[{name:"Learning Express • Boca Raton",lat:26.395,lng:-80.11,query:"Learning Express Boca Raton FL"},{name:"Fetish Factory • Fort Lauderdale",lat:26.1224,lng:-80.1373,query:"Fetish Factory Fort Lauderdale FL"},{name:"Sawgrass Mills • Sunrise",lat:26.151,lng:-80.323,query:"Sawgrass Mills Sunrise FL"},{name:"Spirit Halloween • Miami",lat:25.7617,lng:-80.1918,query:"Spirit Halloween Miami FL"},{name:"The Pelican • Key Largo",lat:25.096,lng:-80.438,query:"The Pelican Key Largo Cottages 99446 Overseas Highway Key Largo FL"}];
const map=L.map("map",{zoomControl:false}).setView([26.1,-80.3],9);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);L.control.zoom({position:"topright"}).addTo(map);
let current=null,car=null,route=null,active=Number(localStorage.getItem("florida-run-active")||0);if(active>=stops.length)active=0;
const dest=document.getElementById("dest"),status=document.getElementById("status"),mission=document.getElementById("mission");
stops.forEach((s,i)=>{let o=document.createElement("option");o.value=i;o.textContent=(i+1)+". "+s.name;dest.appendChild(o);L.marker([s.lat,s.lng],{icon:L.divIcon({className:"",html:'<div class="stop">'+(i+1)+'</div>',iconSize:[30,30]})}).addTo(map).bindPopup(s.name)});
let routeVersion=0;async function routeRoads(pts){if(pts.length<2)return;const v=++routeVersion;try{const coords=pts.map(p=>p[1]+","+p[0]).join(";");const res=await fetch("https://router.project-osrm.org/route/v1/driving/"+coords+"?overview=full&geometries=geojson");if(!res.ok)throw Error("routing unavailable");const data=await res.json();if(v!==routeVersion||!data.routes?.length)return;const road=data.routes[0].geometry.coordinates.map(p=>[p[1],p[0]]);route.setLatLngs(road);if(current)document.getElementById("distance").textContent=(data.routes[0].distance/1609.344).toFixed(1)+" mi";}catch(e){console.warn("Straight-line fallback",e)}}function draw(){dest.value=active;mission.textContent="NEXT MISSION: "+stops[active].name;let pts=[...(current?[[current.lat,current.lng]]:[]),...stops.slice(active).map(s=>[s.lat,s.lng])];if(route)map.removeLayer(route);route=L.polyline(pts,{color:"#9c54ff",weight:9,opacity:.9}).addTo(map);if(!current)map.fitBounds(route.getBounds(),{padding:[65,75]});routeRoads(pts);}
document.getElementById("panel").classList.add("collapsed");draw();dest.onchange=()=>{active=+dest.value;localStorage.setItem("florida-run-active",active);draw()};document.getElementById("complete").onclick=()=>{active=(active+1)%stops.length;localStorage.setItem("florida-run-active",active);draw()};document.getElementById("navigate").onclick=()=>{let s=stops[active];window.open("https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(s.query)+"&travelmode=driving","_blank")};document.getElementById("center").onclick=()=>{if(current)map.setView([current.lat,current.lng],15);else status.textContent="Start GPS first."};
document.getElementById("start").onclick=()=>{if(!navigator.geolocation){status.textContent="GPS unavailable in this browser.";return}status.textContent="Requesting location permission…";navigator.geolocation.watchPosition(p=>{current={lat:p.coords.latitude,lng:p.coords.longitude};if(!car)car=L.marker([current.lat,current.lng],{icon:L.divIcon({className:"car",html:"▲",iconSize:[34,34]})}).addTo(map);else car.setLatLng([current.lat,current.lng]);let miles=map.distance([current.lat,current.lng],[stops[active].lat,stops[active].lng])/1609.344;document.getElementById("distance").textContent=miles.toFixed(1)+" mi";status.textContent="GPS active • ±"+Math.round(p.coords.accuracy)+" m";draw();map.setView([current.lat,current.lng],16)},e=>{status.textContent="GPS error: "+e.message},{enableHighAccuracy:true,maximumAge:3000,timeout:20000})};
</script></body></html>
